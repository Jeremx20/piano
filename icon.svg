<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1d1d27"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0c674"/>
      <stop offset="100%" stop-color="#a07e2f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#d4a857" stroke-width="2" opacity="0.3"/>

  <!-- Stylized G (Gospel) -->
  <text x="256" y="340"
        font-family="Georgia, serif"
        font-size="320"
        font-weight="400"
        font-style="italic"
        text-anchor="middle"
        fill="url(#gold)">G</text>

  <!-- Small accent line above -->
  <line x1="186" y1="156" x2="326" y2="156" stroke="#d4a857" stroke-width="2" opacity="0.6"/>

  <!-- Small dot ornament -->
  <circle cx="256" cy="156" r="3" fill="#f0c674"/>
</svg>
